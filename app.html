<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E🌻%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E🌻%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#2e3a30; --muted:#6f7d6c; --line:#e7eee2; --bg:#fbfbf4; --card:#ffffff;
  --green:#2f9e6b; --greendk:#2b6f4e; --red:#e5484d; --amber:#e0a52e; --blue:#4a90d9; --teal:#159b8e;
  --shadow:0 2px 6px rgba(70,110,80,.08),0 10px 26px rgba(70,110,80,.09);
  --sun:#f2c14e; --coral:#ef8a6a; --lav:#a99be0; --sky:#6fb7e6; --spring:#5bc48a; --wheat:#e9c46a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
/* sidebar */
aside{background:#12261e;color:#e9f1ec;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:16px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
aside .tag{font-size:11px;opacity:.6;margin-bottom:18px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:#cfe0d8;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.active{background:var(--green);color:#fff}
nav .ico{width:20px;text-align:center}
.folderbox{margin-top:20px;padding:12px;background:rgba(255,255,255,.06);border-radius:10px;font-size:12px;color:#bcd}
.folderbox b{color:#fff}
.side-foot{margin-top:18px;font-size:11px;opacity:.55;line-height:1.5}
/* main */
main{padding:28px 34px;max-width:1180px;margin-inline:auto;box-sizing:border-box}
.view{display:none}.view.active{display:block}
h2.title{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--greendk)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700}
.btn:hover{background:var(--greendk)}
.btn.ghost{background:#eef3f0;color:var(--greendk)}
.btn.ghost:hover{background:#e0ebe5}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:700;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;color:var(--greendk)}
.stat .l{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
input.f,textarea.f,select.f{width:100%;border:1px solid #d6ded9;border-radius:8px;padding:8px 10px;background:#fff}
textarea.f{min-height:64px;resize:vertical}
label.lab{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:10px 0 4px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.q .qt{font-weight:700;font-size:14px}
.q .qw{font-size:12.5px;color:var(--muted);margin-top:3px}
.q.checked{opacity:.55;background:#f3f7f4}
.q .qt.done{text-decoration:line-through}
.chk{transform:scale(1.25);margin-right:9px;accent-color:var(--green)}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
.banner{background:#eef7f2;border-left:4px solid var(--green);border-radius:8px;padding:12px 15px;font-size:13px;color:#1c3a2c;margin-bottom:16px}
.warn{background:#fff5ef;border-left:4px solid var(--amber);color:#5a3a10}
.del{color:var(--red);background:none;border:none;font-size:12px;font-weight:700}
.tabsline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filt{border:1px solid #d6ded9;background:#fff;border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.filt.on{background:var(--greendk);color:#fff;border-color:var(--greendk)}
code{background:#eef3f0;padding:2px 5px;border-radius:5px;font-size:12.5px}
pre{background:#12261e;color:#e9f1ec;padding:16px;border-radius:12px;overflow:auto;font-size:12.5px;line-height:1.5;white-space:pre-wrap;max-height:420px}
.st-notstarted{background:#8a94a6}.st-drafted{background:var(--blue)}.st-sent{background:var(--amber)}
.st-replied{background:var(--green)}.st-meeting{background:var(--teal)}.st-noreply{background:#d9601a}.st-declined{background:var(--red)}.st-pending{background:#b0b0b0}
select.status{border:none;border-radius:14px;padding:6px 10px;font-size:12px;font-weight:700;color:#fff;-webkit-appearance:none;appearance:none}
.mini{font-size:11.5px;color:var(--muted)}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.kcol{min-width:210px;flex:0 0 210px;background:#eef1ef;border-radius:12px;padding:8px}
.khead{font-size:11px;font-weight:800;color:#fff;padding:6px 10px;border-radius:8px;display:flex;justify-content:space-between;margin-bottom:8px}
.kbody{min-height:50px;border-radius:8px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kcard:active{cursor:grabbing}
.kwho{font-weight:700;font-size:13px}.kask{font-size:11.5px;color:var(--muted);margin:2px 0}
.kfoot{display:flex;justify-content:space-between;align-items:center}
.klast{font-size:11px;color:var(--greendk);margin-top:4px;background:#eef7f2;border-radius:6px;padding:3px 6px}
.kempty{font-size:12px;color:#aab;text-align:center;padding:8px}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto}}
 /* 🌿🌼 wildflower meadow theme */
body{background:
  radial-gradient(1000px 460px at 6% -6%, #f3f0d6 0%, transparent 58%),
  radial-gradient(950px 480px at 100% -2%, #e6f2e0 0%, transparent 55%),
  radial-gradient(880px 600px at 50% 112%, #e5edf8 0%, transparent 55%),
  radial-gradient(680px 400px at 88% 100%, #efe7f4 0%, transparent 55%),
  linear-gradient(135deg,#fbfbf1 0%,#f4f8ed 45%,#eef6ef 72%,#eef3fb 100%) !important;
  background-attachment:fixed !important;}
aside{background:linear-gradient(168deg,#2b6f52 0%,#4f9e77 52%,#8ec48c 100%) !important;color:#fff;box-shadow:4px 0 26px rgba(60,110,80,.20)}
aside h1{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.18)}
aside .tag{color:#eaf6ec;opacity:.9}
nav button{color:#eaf6ec}
nav button:hover{background:rgba(255,255,255,.18);color:#fff}
nav button.active{background:#f2c14e;color:#5a3d00;box-shadow:0 5px 16px rgba(0,0,0,.16);font-weight:800}
.folderbox{background:rgba(255,255,255,.15)}.folderbox b{color:#fff}
.side-foot{opacity:.85;color:#fff}
aside::after{content:"🌼 🌿 🌷 🌾 🌻 💐";display:block;margin-top:24px;text-align:center;font-size:16px;letter-spacing:2px;opacity:.95}
h2.title{background:linear-gradient(90deg,#2f8f5f,#e0a94e);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.card{border:1px solid #eaf0e3;border-radius:18px;box-shadow:0 2px 6px rgba(70,110,80,.07),0 12px 28px rgba(70,110,80,.08);transition:transform .16s ease,box-shadow .16s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(70,110,80,.13),0 20px 40px rgba(70,110,80,.12)}
.card h3{color:#2b6f4e}
.btn{background:linear-gradient(135deg,#37a56f 0%,#7cc47f 100%);box-shadow:0 4px 14px rgba(60,150,100,.30);transition:filter .15s,transform .1s}
.btn:hover{background:linear-gradient(135deg,#2f9463 0%,#6cb972 100%);filter:brightness(1.04);transform:translateY(-1px)}
.btn.ghost{background:#eef7ee;color:#2b6f4e}.btn.ghost:hover{background:#e4f1e3}
.banner{background:linear-gradient(135deg,#f2f8ec 0%,#fbf6e8 100%);border-left:4px solid #7cc47f;color:#2f4636;border-radius:12px}
.warn{background:linear-gradient(135deg,#fbf5e6,#f5f8ee);border-left:4px solid #e0a52e;color:#5f4718}
.stat{border-radius:18px;box-shadow:0 8px 22px rgba(70,110,80,.10)}
.stat .n{background:linear-gradient(90deg,#2f8f5f,#e0a94e);-webkit-background-clip:text;background-clip:text;color:transparent}
.q{border-radius:14px;border-color:#e7eee2}
.chk{accent-color:#2f9e6b}
.filt.on{background:linear-gradient(135deg,#37a56f,#7cc47f);border-color:transparent;color:#fff}
.kcol{background:linear-gradient(180deg,#f0f7ee,#eef4f8);border:1px solid #e7eee2}
.kcard{border-radius:14px;border-color:#e7eee2}.kcard:hover{box-shadow:0 6px 16px rgba(70,110,80,.15)}
.klast{background:#eef7ee;color:#2b6f4e}
a{color:#2f8f5f}
::selection{background:#dff0d8}

/* 🌱 beacon-of-growth garden */
.app{position:relative;z-index:1}
main{padding-bottom:190px !important}
.garden{position:absolute;left:0;right:0;bottom:0;height:clamp(118px,15vh,172px);z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 50%,#8ccf7f 74%,#6cbb69 100%)}
.garden svg{width:100%;height:100%;display:block;filter:drop-shadow(0 -2px 6px rgba(60,120,70,.10))}
.sunbeam{position:fixed;top:-150px;right:-120px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,#fff6c8 0%,#ffe89b66 34%,transparent 70%);z-index:0;pointer-events:none}
.card{background:#ffffff}
@media(max-width:760px){main{padding-bottom:180px !important}}
@media print{
 #nav,.side-foot,.garden,.tabsline,.noprint,.del,#trAdd{display:none!important}
 .app{display:block!important}
 main{max-width:100%!important;padding:0!important;margin:0!important}
 .card{break-inside:avoid;box-shadow:none!important;border:1px solid #bbb;margin:6px 0;padding:8px}
 select{-webkit-appearance:none;appearance:none;border:none!important;background:transparent!important;color:#000!important;padding:0!important;font-size:10px}
 table{font-size:9px} th{background:#eee!important;-webkit-print-color-adjust:exact}
 body,.app{background:#fff!important} .title{font-size:16px}
 h2:after{content:" — printed from Bloom, verify against source reports";font-weight:normal;font-size:9px;color:#777}
}
</style>
</head>

let S=load();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.profile?v:blank();}catch(e){return blank();}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function loadExample(){S=exampleState();save();cur='overview';render();}

let cur='overview';
function nav(){
  const n=document.getElementById('nav');n.innerHTML='';
  VIEWS.forEach(([id,ic,label])=>{
    const b=document.createElement('button');b.className='navbtn'+(id===cur?' active':'');
    b.innerHTML=`<span class="ico">${ic}</span> ${label}`;
    b.onclick=()=>{cur=id;render();};n.appendChild(b);
  });
  document.getElementById('folderbox').innerHTML = S.folderName
    ? `📁 <b>${esc(S.folderName)}</b><br>${S.docs.length} files catalogued`
    : 'No folder connected yet.';

}

function render(){
  nav();
  const m=document.getElementById('main');
  m.innerHTML = ({overview:vOverview,fights:vFights,timeline:vTimeline,docs:vDocs,questions:vQuestions,scans:vScans,trials:vTrials,outreach:vOutreach,team:vTeam,board:vBoard,assist:vAssist,faith:vFaith,about:vAbout})[cur]();

}

/* ---------------- OVERVIEW ---------------- */
function vFights(){
  const U={now:['#c0392b','⚡ NOW — this week'],high:['#c88a2e','↑ High'],ongoing:['#6b4fc4','↻ Ongoing']};
  const TH={medical:['🧬','For his life — the treatment fight'],access:['🕊️','To be with him — the access fight']};
  const fights=S.fights||[];
  if(!fights.length)return `<h2 class="title">What We're Fighting For</h2><p class="sub">No fights logged yet.</p>`;
  return `
  <h2 class="title">What We're Fighting For</h2>
  <p class="sub">The battles that actually change the outcome — each with the <b>concern</b>, the <b>push</b>, and what's at stake. This is the whole war on one page, so nothing high-leverage ever gets buried.</p>
  ${['medical','access'].map(g=>{
    const list=fights.filter(f=>f.theater===g);
    if(!list.length)return '';
    return `<h3 style="margin:20px 0 10px;color:#0a5137;font-size:16px">${TH[g][0]} ${TH[g][1]}</h3>
    ${list.map(f=>{const u=U[f.urgency]||U.high;return `
      <div class="card" style="border-left:4px solid ${u[0]}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
          <b style="font-size:15px">${esc(f.title)}</b>
          <span style="background:${u[0]};color:#fff;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:800;white-space:nowrap">${u[1]}</span>
        </div>
        <div style="margin-top:8px;font-size:13.5px;line-height:1.5"><span style="color:#c0392b;font-weight:800;font-size:11px">⚠ CONCERN&nbsp;&nbsp;</span>${esc(f.concern)}</div>
        <div style="margin-top:6px;font-size:13.5px;line-height:1.5"><span style="color:#0a8a5f;font-weight:800;font-size:11px">➜ THE PUSH&nbsp;&nbsp;</span>${esc(f.push)}</div>
        ${f.stakes?`<div style="margin-top:6px;font-size:12px;color:var(--muted);font-style:italic">What's at stake: ${esc(f.stakes)}</div>`:''}
      </div>`;}).join('')}`;
  }).join('')}`;
}

function vOverview(){
  const p=S.profile;
  const openQ=S.questions.filter(q=>!q.done).length;
  const sent=S.outreach.filter(o=>['sent','replied','meeting'].includes(o.s)).length;
  const replied=S.outreach.filter(o=>o.s==='replied'||o.s==='meeting').length;
  const isoOf=s=>{const m=(s||'').match(/\d{4}-\d{2}(?:-\d{2})?/);return m?(m[0].length===7?m[0]+'-01':m[0]):null;};
  const next=[...S.timeline].map(t=>({t,iso:isoOf(t.date)})).filter(x=>x.iso&&x.iso>=today()).sort((a,b)=>a.iso.localeCompare(b.iso)).map(x=>x.t)[0];
  return `
  <h2 class="title">Overview</h2>
  <p class="sub">The whole picture on one screen. ${p.updated?('Updated '+esc(p.updated)):''} &nbsp;<button class="btn ghost sm" id="loadEx">👀 See a filled-in example</button></p>
  ${!S.folderName?`<div class="banner">👋 <b>Start here:</b> go to <b>Documents</b> and connect your folder (on your computer or your Google Drive folder). Then fill in the child profile below. Everything stays private on this machine.</div>`:''}
  <div class="grid" style="margin-bottom:18px">
    <div class="stat"><div class="n">${S.docs.length}</div><div class="l">documents organized</div></div>
    <div class="stat"><div class="n">${openQ}</div><div class="l">questions still to ask</div></div>
    <div class="stat"><div class="n">${sent}</div><div class="l">people contacted</div></div>
    <div class="stat"><div class="n">${replied}</div><div class="l">replies / meetings</div></div>
  </div>
  <div class="card"><h3>Child</h3>
    <div class="row">
      <div style="flex:1;min-width:200px"><label class="lab">Name</label><input class="f" data-p="child" value="${esc(p.child)}" placeholder="Child's name"></div>
      <div style="flex:1;min-width:140px"><label class="lab">Date of birth</label><input class="f" data-p="dob" value="${esc(p.dob)}" placeholder="e.g. 14 Mar 2016"></div>
    </div>
    <label class="lab">Diagnosis</label><input class="f" data-p="dx" value="${esc(p.dx)}" placeholder="e.g. Ewing sarcoma">
    <div class="row">
      <div style="flex:1;min-width:200px"><label class="lab">Genetic / molecular markers</label><input class="f" data-p="markers" value="${esc(p.markers)}" placeholder="e.g. EWSR1-ETV1, MSS"></div>
      <div style="flex:1;min-width:140px"><label class="lab">Stage / extent</label><input class="f" data-p="stage" value="${esc(p.stage)}" placeholder="e.g. Stage 4"></div>
    </div>
    <label class="lab">Current status / treatment (one line)</label><input class="f" data-p="current" value="${esc(p.current)}" placeholder="e.g. relapsed, on regorafenib, restaging soon">
    <label class="lab">Last updated</label><input class="f" data-p="updated" value="${esc(p.updated)}" placeholder="today's date + a short note">
  </div>
  <div class="card"><h3>🎯 Top priorities right now</h3>
    <p class="mini">The 1–3 most important things to do or decide. Keep this short.</p>
    ${S.priorities.map((x,i)=>`<input class="f" data-pri="${i}" value="${esc(x)}" placeholder="Priority ${i+1}" style="margin-bottom:8px">`).join('')}
    <button class="btn ghost sm" id="addPri">+ add priority</button>
  </div>
  ${next?`<div class="card"><h3>⏳ Next deadline</h3><b>${esc(next.date)}</b> — ${esc(next.title)} <span class="mini">(${daysTo(next.date)})</span></div>`:''}
  `;
}

function vTimeline(){

  return `

/* ---------------- SCANS (imaging sorted by modality) ---------------- */
function isImaging(d){
  const n=(d.name||'').toLowerCase();
  return (d.cat||'').toLowerCase().includes('imaging') || ['dcm','dicom'].includes((d.ext||'').toLowerCase())
    || /(mri|irm|\bpet\b|\bct\b|scanner|\btdm\b|ultrasound|echo|écho|x-ray|xray|radiograph|\bscan\b|imaging|petscan)/.test(n);
}
function modalityOf(d){
  const s=((d.name||'')+' '+(d.cat||'')).toLowerCase();
  if(/(mri|irm)/.test(s))return 'MRI';
  if(/\bpet\b|petscan/.test(s))return 'PET / PET-CT';
  if(/\bct\b|scanner|\btdm\b|thoraci|chest ct/.test(s))return 'CT';
  if(/(ultrasound|echo|écho|cardiac|sonograph)/.test(s))return 'Ultrasound / Echo';
  if(/(x-ray|x ray|xray|radiograph|\brx\b)/.test(s))return 'X-ray';
  return 'Other imaging';
}
function vScans(){
  const scans=(S.docs||[]).filter(isImaging);
  const order=['MRI','PET / PET-CT','CT','Ultrasound / Echo','X-ray','Other imaging'];
  const ICON={'MRI':'🧠','PET / PET-CT':'✨','CT':'🫁','Ultrasound / Echo':'🫀','X-ray':'🦴','Other imaging':'🩻'};
  const groups={}; scans.forEach(d=>{const m=modalityOf(d);(groups[m]=groups[m]||[]).push(d);});
  const present=order.filter(m=>groups[m]&&groups[m].length);
  return `
  <h2 class="title">Scans &amp; Imaging</h2>
  <p class="sub">Every scan, sorted by type — ${scans.length} imaging item${scans.length===1?'':'s'} across ${present.length} type${present.length===1?'':'s'}. Connect your records folder in <b>Documents</b> to view them here.</p>
  ${present.length?present.map(m=>`
    <div class="card"><h3>${ICON[m]||'🩻'} ${esc(m)} <span class="mini">(${groups[m].length})</span></h3>
      <table><tr><th>Scan</th><th style="width:170px">View</th><th style="width:80px">Type</th></tr>
      ${groups[m].map(d=>{
        const key=(baseName(d.path)||d.name||'').toLowerCase();
        const url=docFiles[key]||docFiles[(d.name||'').toLowerCase()];
        const isI=['jpg','jpeg','png','gif','webp','heic','bmp'].includes((d.ext||'').toLowerCase());
        const openHref=url||(/^(file|https?|blob):/.test(d.path||'')?d.path:'');
        const view=url?`<button class="btn sm" data-prev="${url}" data-ptype="${isI?'img':'pdf'}" data-pname="${esc(d.name)}">👁 Preview</button> <a class="btn sm ghost" href="${url}" target="_blank" rel="noopener">⤢</a>`:(openHref?`<a class="btn sm ghost" href="${esc(openHref)}" target="_blank" rel="noopener">⤢ Open</a>`:`<span class="mini">connect folder ↗</span>`);
        return `<tr><td><b>${esc(d.name)}</b>${d.snippet?`<div class="mini">${esc(d.snippet.slice(0,110))}…</div>`:''}</td><td>${view}</td><td class="mini">${esc(d.ext||'')}</td></tr>`;
      }).join('')}
      </table>
    </div>`).join(''):`<div class="card"><div class="empty">No scans yet. Add them in <b>Documents</b> — they'll auto-sort here by type.</div></div>`}
  <div id="docModal" style="display:none;position:fixed;inset:0;background:rgba(20,30,24,.88);z-index:9999;padding:22px">

  return `You are a warm, steady companion inside "Bloom", a private app used by a parent whose child is fighting cancer while the parent also fights for the right to see their child. This parent is carrying something almost unbearable.

Be part gentle listener, part practical help:
- Be human first. Validate feelings. Don't rush to fix, don't lecture, no clinical or corporate language, no toxic positivity. Keep it short, warm, and real.
- It is okay to just sit with them in something hard.
- When they ask you to help think something through (medical, logistical, legal, emotional), help clearly using the context below — but never make definitive medical or legal decisions for them; gently point those back to their care team or lawyer.
- Never minimise what they are going through.
- If they express thoughts of self-harm, hopelessness, or not being able to go on: gently and directly encourage them to reach a real person right now — in the US call or text 988 (Suicide & Crisis Lifeline); in the UK call 116 123 (Samaritans); in Belgium call 107 (Télé-Accueil); anywhere else, findahelpline.com lists local services, or call your local emergency number (112 in Europe, 911 in the US) — and stay present with them.
- You are an AI companion, not a therapist or doctor — be honest about that if it matters.

What you know (may be incomplete):
Child: ${p.child||'their child'}. Diagnosis: ${p.dx||'—'}. Current: ${p.current||'—'}.
The fights they are carrying:
${fights||'—'}

If the parent expresses faith, prays, or asks for spiritual strength, you may gently offer comfort rooted in Scripture (Old and New Testament) — a fitting verse and a short prayer — humbly and never preachy, always following their lead. There is also a "Faith & Strength" section in the app with Scripture and prayers for hard moments.

Keep replies fairly short unless they clearly want more depth.`;
}
let pendingAtt=[]; // pre-send attachments: {name, kind:'text'|'image', text?, dataUrl?}
async function addAttachments(fileList){
  for(const f of [...fileList]){
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(['png','jpg','jpeg','gif','webp','bmp'].includes(ext)||/^image\//.test(f.type)){
      const dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});
      pendingAtt.push({name:f.name,kind:'image',dataUrl});
    } else if(['txt','md','csv','json','rtf','log','html','xml'].includes(ext)||/^text\//.test(f.type)){
      let txt=await f.text(); if(txt.length>24000)txt=txt.slice(0,24000)+'\n…(truncated)';
      pendingAtt.push({name:f.name,kind:'text',text:txt});
    } else {
      pendingAtt.push({name:f.name,kind:'text',text:'('+ext.toUpperCase()+' file — its contents can\'t be read here. For a PDF report, paste the text; for a scan, attach a PNG/JPG image.)'});
    }
  }
  render();
}
async function callAI(){
  const ai=S.ai||{}, chat=S.chat||[], sys=sysPrompt();
  const filesToText=m=>(m.files||[]).map(f=>`\n\n[Attached document: ${f.name}]\n${f.text}`).join('');
  if(ai.backend==='claude'){
    if(!ai.claudeKey) throw new Error('add your Anthropic API key in setup');
    const msgs=chat.map(m=>{ if(m.role!=='user')return {role:m.role,content:m.content};
      const parts=[{type:'text',text:(m.content||'')+filesToText(m)}];
      (m.images||[]).forEach(u=>{const mt=(u.match(/^data:(.*?);base64,/)||[])[1]||'image/png';parts.push({type:'image',source:{type:'base64',media_type:mt,data:u.split(',')[1]}});});
      return {role:'user',content:parts}; });
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':ai.claudeKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:ai.claudeModel||'claude-3-5-sonnet-latest',max_tokens:1500,system:sys,messages:msgs})});
    if(!r.ok) throw new Error('Claude '+r.status+' (check key/model)');
    const j=await r.json(); return (j.content||[]).map(c=>c.text).join('');
  }
  if(ai.backend==='openai'){
    if(!ai.openaiKey) throw new Error('add your OpenAI API key in setup');
    const msgs=[{role:'system',content:sys},...chat.map(m=>{ if(m.role!=='user')return {role:m.role,content:m.content};
      if((m.images||[]).length){ const parts=[{type:'text',text:(m.content||'')+filesToText(m)}]; (m.images||[]).forEach(u=>parts.push({type:'image_url',image_url:{url:u}})); return {role:'user',content:parts}; }
      return {role:'user',content:(m.content||'')+filesToText(m)}; })];
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+ai.openaiKey},body:JSON.stringify({model:ai.openaiModel||'gpt-4o-mini',messages:msgs})});
    if(!r.ok) throw new Error('OpenAI '+r.status+' (check key/model)');
    const j=await r.json(); return j.choices[0].message.content;
  }
  const msgs=[{role:'system',content:sys},...chat.map(m=>{ const o={role:m.role,content:(m.content||'')+(m.role==='user'?filesToText(m):'')}; if(m.role==='user'&&(m.images||[]).length)o.images=m.images.map(u=>u.split(',')[1]); return o; })];
  const r=await fetch('http://localhost:11434/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:(ai.ollamaModel||'llama3.2:3b'),messages:msgs,stream:false})});
  if(!r.ok) throw new Error('Ollama '+r.status);
  const j=await r.json(); return j.message.content;
}
async function chatSend(){
  const el=document.getElementById('chatIn'); const text=el?el.value.trim():'';
  if(!text && !pendingAtt.length) return;
  const files=pendingAtt.filter(a=>a.kind==='text').map(a=>({name:a.name,text:a.text}));
  const images=pendingAtt.filter(a=>a.kind==='image').map(a=>a.dataUrl);
  S.chat=S.chat||[]; S.chat.push({role:'user',content:text||'(shared an attachment)',files,images}); pendingAtt=[]; save(); render();
  const log=document.getElementById('chatLog');
  if(log){const t=document.createElement('div');t.textContent='… thinking';t.style.cssText='align-self:flex-start;color:#9aa;padding:6px 10px';log.appendChild(t);log.scrollTop=log.scrollHeight;}
  try{ const reply=await callAI(); S.chat.push({role:'assistant',content:(reply||'(no reply)').trim()}); }
  catch(e){ S.chat.push({role:'assistant',content:"I couldn't reach the AI just now — "+(e.message||e)+".\n\nCheck “change / set up” below. Note: to actually read a scan image, the engine needs a vision model — your current local model is text-only (see the 📎 note)."}); }
  save(); render();
  const l2=document.getElementById('chatLog'); if(l2) l2.scrollTop=l2.scrollHeight;
}

/* ---------------- helpers ---------------- */
function today(){const d=new Date();return d.toISOString().slice(0,10);}
function daysTo(ds){const d=(new Date(ds)-new Date(today()))/864e5;if(isNaN(d))return '';if(d<0)return Math.abs(Math.round(d))+' days ago';if(d===0)return 'today';return 'in '+Math.round(d)+' days';}
function catGuess(name){const n=name.toLowerCase();
  if(/dicom|\.dcm|dicomdir/.test(n))return 'Imaging — scans (raw)';
  if(/path|biops|histo|anatomo/.test(n))return 'Diagnosis & pathology';
  if(/genet|molecul|ngs|fusion|fish|\bdna\b|\brna\b|inform|ghent|gand|ewsr|etv1|fli1/.test(n))return 'Genetics & molecular';
  if(/lab|blood|cbc|bloods|\bnfs\b|prise de sang/.test(n))return 'Labs';
  if(/opinion|second|avis|consult|review|referral/.test(n))return 'Second opinions';
  if(/\bmri\b|\birm\b|\bct\b|\bpet\b|\btep\b|scan|scanner|thorax|radiolog|report|rapport/.test(n))return 'Imaging — reports';
  if(/protocol|treatment|traitement|chemo|regimen|radio|vinorelb|regorafenib|cyclophosph|maintenance|\brt\b/.test(n))return 'Treatment & radiotherapy';
  if(/consult|letter|courrier|attest|\bnote\b/.test(n))return 'Doctor letters & consultations';
  if(/\bfss\b|insurance|funding|facture|remboursement|solidarit|invoice|mutuelle/.test(n))return 'Insurance & funding';
  if(/translat|traduction|traduit/.test(n))return 'Translated & master records';
  if(/legal|court|custody|avocat|jugement|tribunal/.test(n))return 'Legal';
  return 'Uncategorised';}

async function ingest(files){
  const arr=[...files];
  S.folderName=S.folderName|| (arr[0]&&arr[0].webkitRelativePath? arr[0].webkitRelativePath.split('/')[0] : 'My files');
  let i=S.docs.length;
  for(const f of arr){
    if(f.name.startsWith('.'))continue;
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    docFiles[f.name.toLowerCase()]=URL.createObjectURL(f);   // live preview handle (session only)
    // link this file to an already-listed record (seeded or added) by filename
    if(S.docs.some(d=>baseName(d.path).toLowerCase()===f.name.toLowerCase() || (d.name||'').toLowerCase()===f.name.toLowerCase())){continue;}
    if(!DOCEXT.includes(ext))continue;                        // skip DICOM & non-document files (don't flood the list)
    const rel=f.webkitRelativePath||f.name;
    if(S.docs.some(d=>d.path===rel))continue;
    let snippet='';
    if(['txt','md','csv','json','rtf'].includes(ext)){try{snippet=(await f.text()).replace(/\s+/g,' ').trim().slice(0,600);}catch(e){}}
    S.docs.push({id:'d'+(i++),name:f.name,path:rel,ext,size:f.size,cat:catGuess(f.name),snippet});
  }
  save();render();
}

/* ===== Google Drive connect (client-side; data goes only between your browser and Google) ===== */
let gdToken=null, gdTokenClient=null;
function injectScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function connectDrive(){
  if(!GOOGLE_CLIENT_ID||!GOOGLE_API_KEY){showGoogleSetup();return;}
  try{
    if(!window.google||!window.google.accounts)await injectScript('https://accounts.google.com/gsi/client');
    if(!window.gapi)await injectScript('https://apis.google.com/js/api.js');
    await new Promise(r=>gapi.load('client:picker',r));
    await gapi.client.init({apiKey:GOOGLE_API_KEY});
    gdTokenClient=gdTokenClient||google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:'https://www.googleapis.com/auth/drive.readonly',
      callback:(resp)=>{if(resp&&resp.access_token){gdToken=resp.access_token;openDrivePicker();}}
    });
    gdTokenClient.requestAccessToken({prompt:gdToken?'':'consent'});
  }catch(e){alert('Could not start Google connect. See SETUP-GOOGLE.md.');}
}
function openDrivePicker(){
  const view=new google.picker.DocsView(google.picker.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(true);
  new google.picker.PickerBuilder().setOAuthToken(gdToken).setDeveloperKey(GOOGLE_API_KEY)
    .addView(view).enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
    .setCallback(async d=>{
      if(d.action!==google.picker.Action.PICKED)return;
      for(const doc of d.docs){if(doc.type==='folder')await ingestDriveFolder(doc.id);else await ingestDriveFile(doc);}
      save();render();
    }).build().setVisible(true);
}
async function ingestDriveFolder(id){
  const q=encodeURIComponent(`'${id}' in parents and trashed=false`);
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType,size)&pageSize=1000`,{headers:{Authorization:'Bearer '+gdToken}});
  const j=await r.json();for(const f of (j.files||[]))await ingestDriveFile(f);
}
async function ingestDriveFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(S.docs.some(d=>d.path==='gdrive:'+f.id))return;
  S.folderName=S.folderName&&S.folderName!=='My files'?S.folderName:'Google Drive';
  let snippet='';const mt=f.mimeType||'';
  try{
    if(/google-apps\.document/.test(mt)){const r=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}/export?mimeType=text/plain`,{headers:{Authorization:'Bearer '+gdToken}});snippet=(await r.text()).replace(/\s+/g,' ').trim().slice(0,600);}
    else if(['txt','md','csv','json','rtf'].includes(ext)||/^text\//.test(mt)){const r=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:{Authorization:'Bearer '+gdToken}});snippet=(await r.text()).replace(/\s+/g,' ').trim().slice(0,600);}
  }catch(e){}
  S.docs.push({id:'d'+Date.now()+Math.random().toString(36).slice(2,5),name:f.name,path:'gdrive:'+f.id,ext,size:f.size||0,cat:catGuess(f.name),snippet,source:'gdrive'});
}

        <input id="emLogNote" placeholder="What happened? e.g. 'Sent', 'She replied — wants scans', 'Call booked Tue'" style="flex:1;border:1px solid #d6ded9;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit">
        <button style="background:#0a8a5f;color:#fff;border:none;border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer" id="emLogAdd">+ Log</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button style="background:#eef3f0;color:#0a5137;border:none;border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer" id="emCopy">📋 Copy</button>
      <button style="background:#eef3f0;color:#0a5137;border:none;border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer" id="emSave">Save</button>
      <button style="background:#0a8a5f;color:#fff;border:none;border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer" id="emClose">Close</button>
    </div></div>`;
  document.body.appendChild(d);
  const ta=d.querySelector('#emBody');
  d.querySelector('#emClose').onclick=()=>d.remove();
  d.onclick=e=>{if(e.target===d)d.remove();};
  d.querySelector('#emStatus').onchange=e=>{o.s=e.target.value;save();};
  d.querySelector('#emLogAdd').onclick=()=>{
    const note=d.querySelector('#emLogNote').value.trim();if(!note)return;
    (o.log=o.log||[]).push({date:today(),note});o.email=ta.value;save();d.remove();showEmail(id);
  };
  d.querySelector('#emSave').onclick=()=>{o.email=ta.value;save();d.remove();render();};
  d.querySelector('#emCopy').onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(ta.value);const b=d.querySelector('#emCopy');b.textContent='✓ Copied';setTimeout(()=>b.textContent='📋 Copy',1400);};
}

// file inputs
document.getElementById('dirpick').addEventListener('change',e=>{if(e.target.files.length){ingest(e.target.files);}e.target.value='';});
document.getElementById('filepick').addEventListener('change',e=>{if(e.target.files.length){ingest(e.target.files);}e.target.value='';});
document.getElementById('importpick').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const v=JSON.parse(r.result);if(v.profile){S=v;save();render();alert('Data imported.');}}catch(err){alert('Could not read that file.');}};
  r.readAsText(f);e.target.value='';});

render();
</script>
</body>
</html>
